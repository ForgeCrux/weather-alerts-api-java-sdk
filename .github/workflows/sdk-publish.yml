# Publication bff8ac92-9c4e-4620-9004-916382b6b228
name: SDK Bundle Publish
on:
  push:
    paths:
      - '.github/workflows/sdk-publish.yml'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BUNDLE: "gs://probestack-forgestudio-sdk/ForgeStudio/Credit-Card/6ab0ce3a93bb3f70b75bb27f-Credit-Card-java-sdk.zip"
      BUNDLE_SHA256: "d9776cb086cd0f949c38cd5aa4d6b26bee5f25685c6bd902c9ab62c13dadbaf0"
      PACKAGE_VERSION: "1.0.0"
      PACKAGE_URL: "gs://sdk/1.0.0/sdk-1.0.0.zip"
      DESTINATION: "gs://sdk/1.0.0/sdk-1.0.0.zip"
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: "projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-forgecrux@probestack-prod.iam.gserviceaccount.com"
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download and verify selected SDK bundle
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp "$SOURCE_BUNDLE" bundle.zip
          printf '%s  bundle.zip\n' "$BUNDLE_SHA256" | sha256sum --check --strict
      - name: Deploy verified ZIP bundle
        shell: bash
        run: |
          set -euo pipefail
          upload_args=(--if-generation-match=0 --content-type=application/zip)
          gcloud storage cp bundle.zip "$DESTINATION" "${upload_args[@]}"
      - name: Published bundle
        shell: bash
        run: |
          printf 'Package: %s\nSource bundle SHA-256: %s\n' "$PACKAGE_URL" "$BUNDLE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg url "$PACKAGE_URL" --arg sha "$BUNDLE_SHA256" '{url: $url, artifactSha256: $sha}' > .publish-info.json
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: publish-info
          path: .publish-info.json
          include-hidden-files: true
        continue-on-error: true
