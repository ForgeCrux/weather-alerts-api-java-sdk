name: SDK Publish
on:
  push:
    paths:
      - '.github/workflows/sdk-publish.yml'
concurrency:
  group: sdk-publish-${{ github.repository }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set version
        run: mvn -B -q versions:set -DnewVersion=2.0.0 -DgenerateBackupPoms=false
      - name: Package
        run: |
          mvn -B -q package -DskipTests
          cp "$(ls target/*.jar | grep -v sources.jar | grep -v javadoc.jar | head -n1)" sdk-2.0.0.jar
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-forgecrux@probestack-prod.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: sdk-2.0.0.jar
          destination: forgestudio/sdks/2.0.0
      - name: Print Published Package Banner
        run: |
          echo ""
          echo "================================================================"
          echo "  SDK published: sdk-2.0.0.jar"
          echo "----------------------------------------------------------------"
          echo "  Package URL : gs://forgestudio/sdks/2.0.0/sdk-2.0.0.jar"
          echo "================================================================"
          echo ""
      - name: Write Published Package to Step Summary
        run: |
          {
            echo "## SDK published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Package** | [\`sdk-2.0.0.jar\`](gs://forgestudio/sdks/2.0.0/sdk-2.0.0.jar) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save Published Package as Artifact File
        run: |
          cat > "${{ github.workspace }}/.publish-info.json" <<EOF
          {
            "package": "sdk-2.0.0.jar",
            "url": "gs://forgestudio/sdks/2.0.0/sdk-2.0.0.jar",
            "sha": "${{ github.sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload Published Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-info
          path: ${{ github.workspace }}/.publish-info.json
          if-no-files-found: ignore
        continue-on-error: true
