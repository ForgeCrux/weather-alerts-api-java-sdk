openapi: 3.0.3
info:
  description: "A simple task management API used to end-to-end test MCP generation\
    \ (spec parse, tools, mock server, contract testing, code analysis)."
  title: Task Manager API
  version: 2.0.0
servers:
- url: https://api.taskmanager.example.com/v2
paths:
  /tasks:
    get:
      description: "Returns tasks, optionally filtered by status, with an optional\
        \ page-size limit."
      operationId: listTasks
      parameters:
      - description: Filter tasks by status
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - OPEN
          - IN_PROGRESS
          - DONE
          type: string
        style: form
      - description: Maximum number of tasks to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listTasks_200_response"
          description: A list of tasks
      summary: List all tasks
      x-accepts:
      - application/json
    post:
      description: "Creates a new task with a title and optional description, assignee,\
        \ priority and due date."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createTask_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          description: Task created
      summary: Create a new task
      x-content-type: application/json
      x-accepts:
      - application/json
  /tasks/{taskId}:
    delete:
      description: Permanently deletes a task by ID.
      operationId: deleteTask
      parameters:
      - description: Unique ID of the task to delete
        explode: false
        in: path
        name: taskId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Task deleted successfully
      summary: Delete a task
      x-accepts:
      - application/json
    get:
      description: Retrieves a single task by its unique identifier.
      operationId: getTaskById
      parameters:
      - description: Unique ID of the task
        explode: false
        in: path
        name: taskId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          description: Task found
        "404":
          description: Task not found
      summary: Get a task by ID
      x-accepts:
      - application/json
    put:
      description: "Updates fields of an existing task, including its status and completion\
        \ flag."
      operationId: updateTask
      parameters:
      - description: Unique ID of the task to update
        explode: false
        in: path
        name: taskId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateTask_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          description: Task updated
      summary: Update an existing task
      x-content-type: application/json
      x-accepts:
      - application/json
  /tasks/{taskId}/comments:
    post:
      description: Adds a new comment with optional tags to the specified task's activity
        log.
      operationId: addTaskComment
      parameters:
      - description: Unique ID of the task
        explode: false
        in: path
        name: taskId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addTaskComment_request"
        required: true
      responses:
        "201":
          description: Comment added
      summary: Add a comment to a task
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  schemas:
    Task:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        dueDate: 2000-01-23
        description: description
        id: id
        assignee: assignee
        completed: true
        title: title
        priority: LOW
        status: OPEN
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          enum:
          - OPEN
          - IN_PROGRESS
          - DONE
          type: string
        priority:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          type: string
        assignee:
          type: string
        dueDate:
          format: date
          type: string
        completed:
          type: boolean
        createdAt:
          format: date-time
          type: string
      type: object
    listTasks_200_response:
      example:
        data:
        - createdAt: 2000-01-23T04:56:07.000+00:00
          dueDate: 2000-01-23
          description: description
          id: id
          assignee: assignee
          completed: true
          title: title
          priority: LOW
          status: OPEN
        - createdAt: 2000-01-23T04:56:07.000+00:00
          dueDate: 2000-01-23
          description: description
          id: id
          assignee: assignee
          completed: true
          title: title
          priority: LOW
          status: OPEN
      properties:
        data:
          items:
            $ref: "#/components/schemas/Task"
          type: array
      required:
      - data
      type: object
    createTask_request:
      properties:
        title:
          description: Short title of the task
          type: string
        description:
          description: Longer description of the task
          type: string
        assignee:
          description: Email of the person assigned to the task
          type: string
        priority:
          description: Priority level of the task
          enum:
          - LOW
          - MEDIUM
          - HIGH
          type: string
        dueDate:
          description: Due date for the task (YYYY-MM-DD)
          format: date
          type: string
      required:
      - title
      type: object
    updateTask_request:
      properties:
        title:
          description: Updated title
          type: string
        status:
          description: New status for the task
          enum:
          - OPEN
          - IN_PROGRESS
          - DONE
          type: string
        priority:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          type: string
        completed:
          description: Whether the task is fully completed
          type: boolean
      required:
      - status
      type: object
    addTaskComment_request:
      properties:
        message:
          description: Comment text
          type: string
        author:
          description: Email of the comment author
          type: string
        tags:
          description: Optional tags attached to the comment
          items:
            type: string
          type: array
      required:
      - author
      - message
      type: object

